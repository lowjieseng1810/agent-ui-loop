<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · Northwind</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="panel">
        <p class="eyebrow">Northwind · workspace</p>
        <h1>Sign in</h1>
        <p class="lede">Use your work email to continue to the dashboard.</p>
        <form class="form" action="#" method="post" onsubmit="return false" data-testid="login-form">
          <label>
            Email
            <input type="email" name="email" autocomplete="username" value="ada@northwind.dev" />
          </label>
          <label>
            Password
            <input type="password" name="password" autocomplete="current-password" value="••••••••" />
          </label>
        </form>
      </section>
      <div class="cta-row">
        <button type="button" class="cta" data-testid="primary-cta" onclick="location.href='/dashboard'">Continue to your Northwind workspace dashboard →</button>
      </div>
    </main>
    <img class="mark" src="/mark.svg" alt="" width="32" height="32" />
  </body>
</html>
