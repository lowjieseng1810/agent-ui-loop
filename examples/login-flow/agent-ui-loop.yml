task:
  name: login-flow

url: http://127.0.0.1:48721

routes:
  - /login

viewports:
  - name: desktop
    width: 1440
    height: 900
  - name: mobile
    width: 390
    height: 844

requirements:
  - type: element-visible
    selector: "[data-testid='login-form']"
  - type: element-visible
    selector: "[data-testid='primary-cta']"
  - type: no-horizontal-overflow
  - type: no-console-errors
  - type: route-available

journeys:
  - name: fill-and-continue
    route: /login
    viewport: desktop
    steps:
      - action: fill
        selector: "input[name='email']"
        value: "ada@northwind.dev"
      - action: fill
        selector: "input[name='password']"
        value: "secret"
      - action: click
        selector: "[data-testid='primary-cta']"
      - action: visible
        selector: "[data-testid='dashboard']"
