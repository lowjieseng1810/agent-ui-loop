# Agent UI Loop — verify a running UI from GitHub Actions
#
# Composite action in this repository — not a Marketplace listing.
# After checkout, use `uses: ./`.
# The Action does not start your app. Serve a URL first, then verify.
# Chromium is installed with `python -m playwright install chromium --with-deps`.

name: Agent UI Loop

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Start YOUR app so the URL below actually responds.
      # - name: Start preview
      #   run: |
      #     npm ci
      #     npm run start -- --port 3000 &
      #     npx wait-on http://127.0.0.1:3000

      - name: Verify UI acceptance
        uses: ./
        with:
          url: http://127.0.0.1:3000
          config: agent-ui-loop.yml
          comment: "false"

      # Uploads .agent-ui-loop/runs/ as artifact `agent-ui-proof`
      # and writes github.md into the job summary.
      # Optional PR comment: comment: "true" plus github-token: ${{ secrets.GITHUB_TOKEN }}
