name: "Agent UI Loop"
description: "Agent task-completion verification with UI evidence. Runs Chromium checks, writes a proof artifact, optionally comments on a PR."
author: "Agent UI Loop"

branding:
  icon: check-square
  color: blue

inputs:
  url:
    description: "Base URL of the running UI (overrides config url). You must start the app yourself."
    required: false
    default: ""
  config:
    description: "Path to the acceptance contract YAML"
    required: false
    default: "agent-ui-loop.yml"
  working-directory:
    description: "Directory that contains the config and will receive .agent-ui-loop/"
    required: false
    default: "."
  comment:
    description: "If true, append github.md to the GitHub step summary. Does not post to PRs unless github-token is set and gh is available."
    required: false
    default: "false"
  github-token:
    description: "Optional token used only when comment=true to post github.md as a PR comment via gh. Never uploads screenshots to third parties."
    required: false
    default: ""

outputs:
  result:
    description: "passed or failed"
    value: ${{ steps.verify.outputs.result }}
  run-dir:
    description: "Path to the evidence directory"
    value: ${{ steps.verify.outputs.run-dir }}
  verified:
    description: "true when the proof is VERIFIED"
    value: ${{ steps.verify.outputs.verified }}

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Agent UI Loop + Chromium
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        pip install "${{ github.action_path }}"
        python -m playwright install chromium --with-deps

    - name: Verify
      id: verify
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set +e
        URL_ARGS=()
        if [ -n "${{ inputs.url }}" ]; then
          URL_ARGS=(--url "${{ inputs.url }}")
        fi
        agent-ui-loop run --config "${{ inputs.config }}" "${URL_ARGS[@]}" --json | tee /tmp/agent-ui-loop-summary.json
        STATUS=$?
        RESULT=$(python -c "import json; print(json.load(open('/tmp/agent-ui-loop-summary.json')).get('status','failed'))" 2>/dev/null || echo failed)
        RUN_DIR=$(python -c "import json; print(json.load(open('/tmp/agent-ui-loop-summary.json')).get('runDir',''))" 2>/dev/null || true)
        echo "result=${RESULT}" >> "$GITHUB_OUTPUT"
        echo "run-dir=${RUN_DIR}" >> "$GITHUB_OUTPUT"
        if [ "$RESULT" = "passed" ]; then echo "verified=true" >> "$GITHUB_OUTPUT"; else echo "verified=false" >> "$GITHUB_OUTPUT"; fi
        if [ -n "$RUN_DIR" ] && [ -f "$RUN_DIR/github.md" ]; then
          echo "github.md exists"
        fi
        exit $STATUS

    - name: Job summary
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        RUN_DIR="${{ steps.verify.outputs.run-dir }}"
        if [ -n "$RUN_DIR" ] && [ -f "$RUN_DIR/github.md" ]; then
          cat "$RUN_DIR/github.md" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "No github.md proof (the app URL may have been unreachable)." >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: Optional PR comment
      if: ${{ always() && inputs.comment == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        RUN_DIR="${{ steps.verify.outputs.run-dir }}"
        if [ -z "$GH_TOKEN" ]; then
          echo "comment=true but no github-token; wrote step summary only."
          exit 0
        fi
        if [ -z "$RUN_DIR" ] || [ ! -f "$RUN_DIR/github.md" ]; then
          echo "No github.md to comment."
          exit 0
        fi
        if ! command -v gh >/dev/null; then
          echo "gh CLI not available; skip PR comment."
          exit 0
        fi
        gh pr comment --body-file "$RUN_DIR/github.md" || echo "gh pr comment failed (no PR context?). Proof remains in artifacts."

    - name: Upload proof artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: agent-ui-proof
        path: ${{ inputs.working-directory }}/.agent-ui-loop/runs/
        if-no-files-found: warn
